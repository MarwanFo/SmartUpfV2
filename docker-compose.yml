version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: smartupf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smartupf_redis_ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: smartupf_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=smartupf_user
      - POSTGRES_PASSWORD=smartupf_pass
      - POSTGRES_DB=smartupf_dev
    ports:
      - "5440:5432"
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartupf_user -d smartupf_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data2:
